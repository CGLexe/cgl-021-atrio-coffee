  <style>
    :root {
      --marca: #631C24;
      --marca-osc: #4E141B;
      --papel: #F9F6F0;
      --tinta: #231614;
      --linea: #E7DCD8;
    }
    html { scroll-behavior: smooth; }
    body { background-color: var(--papel); color: var(--tinta); }
    :focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
    ::selection { background: var(--marca); color: var(--papel); }

    /* --- Movimiento. Solo transform y opacity. 0 KB de librerias. --- */
    .cgl-reveal {
      opacity: 0;
      transform: translate3d(0, 16px, 0);
      transition: opacity 520ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cgl-reveal.cgl-in { opacity: 1; transform: translate3d(0, 0, 0); }

    /* Parallax del hero: 10% y solo en escritorio. */
    .cgl-parallax { will-change: transform; }

    /* Pulso del boton flotante. */
    .cgl-wa { animation: cgl-pulse 2600ms cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    @keyframes cgl-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    /* prefers-reduced-motion es bloqueante, no decoracion. */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .cgl-reveal { opacity: 1; transform: none; transition: none; }
      .cgl-parallax { transform: none !important; }
      .cgl-wa { animation: none; }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    (function () {
      var movemos = !('IntersectionObserver' in window);
      var revelar = document.querySelectorAll('section');

      if (movemos) {
        for (var i = 0; i < revelar.length; i++) revelar[i].classList.add('cgl-in');
      } else {
        var obs = new IntersectionObserver(function (entradas) {
          for (var j = 0; j < entradas.length; j++) {
            if (entradas[j].isIntersecting) {
              entradas[j].target.classList.add('cgl-in');
              obs.unobserve(entradas[j].target);
            }
          }
        }, { threshold: 0.15 });
        for (var k = 0; k < revelar.length; k++) {
          revelar[k].classList.add('cgl-reveal');
          obs.observe(revelar[k]);
        }
      }

      /* Parallax: transform puro, 10% del alto, solo >= 768px, y nunca si la
         persona pidio menos movimiento. La imagen se escala antes de moverse:
         si no, el desplazamiento destapa los bordes dentro del recorte. */
      var sinMover = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var capa = document.getElementById('cgl-hero-img');
      if (capa && !movemos && !sinMover && window.matchMedia('(min-width: 768px)').matches) {
        capa.classList.add('cgl-parallax');
        var tope = 10;
        var ajustar = function () {
          var r = capa.getBoundingClientRect();
          if (r.bottom < 0) return;
          var avance = Math.min(Math.max(-r.top / r.height, 0), 1);
          capa.style.transform = 'scale(1.14) translate3d(0,' +
            ((avance - 0.5) * tope).toFixed(2) + '%,0)';
        };
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(function () { ajustar(); ticking = false; });
        }, { passive: true });
        ajustar();
      }

      var wa = document.querySelector('.cgl-wa-flotante');
      if (wa) wa.classList.add('cgl-wa');
    })();
  </script>
